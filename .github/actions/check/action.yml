name: Check
description: Lint, Knip, typecheck, and the full test suite

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - shell: bash
      run: pnpm lint
    - shell: bash
      run: pnpm knip
    - shell: bash
      run: pnpm typecheck
    - shell: bash
      run: pnpm test
